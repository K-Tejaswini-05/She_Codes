function searchFaculty() {
  const input = document.getElementById("facultySearch").value.trim().toLowerCase();
  const result = document.getElementById("facultyResult");

  if (!input) {
    result.innerHTML = "<p>Please enter a faculty name</p>";
    return;
  }

  const faculty = facultyDB.find(f =>
    f.name.toLowerCase().includes(input)
  );

  if (!faculty) {
    result.innerHTML = "<p>No faculty found</p>";
    return;
  }

  result.innerHTML = `
    <div class="card">
      <p><b>ID:</b> ${faculty.id}</p>
      <p><b>Name:</b> ${faculty.name}</p>
      <p><b>Department:</b> ${faculty.dept}</p>
      <p><b>Staff Room:</b> ${faculty.room}</p>
      <p><b>Phone:</b> ${faculty.phone}</p>
    </div>
  `;
}
